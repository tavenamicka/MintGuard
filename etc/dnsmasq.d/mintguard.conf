# Écouter sur localhost:5354 (PAS 5353 : port mDNS/Avahi standard, déjà
# utilisé par avahi-daemon sur Linux Mint, cf. SUIVI.md Phase 3)
listen-address=127.0.0.1
port=5354

# Blocklist dynamique generee par le daemon MintGuard.
#
# Fragment de configuration (directives `address=/domaine/0.0.0.0`) et NON
# un fichier hosts (`addn-hosts`) : un fichier hosts ne matche que le nom
# exact, donc bloquer "youtube.com" laissait "www.youtube.com" accessible,
# c'est-a-dire le site lui-meme. `address=/youtube.com/` couvre le domaine
# ET tous ses sous-domaines.
#
# Contrepartie : un SIGHUP (`systemctl reload`) ne relit que les fichiers
# hosts, jamais la configuration -> le daemon fait un `systemctl restart`,
# et seulement quand la blocklist a reellement change (voir
# DNSController.apply()).
#
# Repertoire separe de /var/lib/mintguard (verrouille 2770 pour la BD) :
# dnsmasq tourne en utilisateur non-privilegie et ne peut pas traverser
# un repertoire dont il n'a pas le droit d'execution - voir SUIVI.md
# Phase 3 (5e defaut de conception).
conf-file=/var/lib/mintguard-dns/blocklist.conf

# Canari DoH de Firefox : renvoyer NXDOMAIN sur ce domaine special
# (`server=/domaine/` sans serveur amont) indique a Firefox qu'un filtrage
# reseau est en place, et desactive son DNS-over-HTTPS automatique.
# Sans cela, Firefox resout les domaines par HTTPS aupres de Cloudflare et
# contourne integralement le blocage DNS de MintGuard.
# Limite connue : ne couvre PAS un DoH active manuellement par l'utilisateur,
# ni Chrome (qui n'implemente pas ce canari). Voir SUIVI.md.
server=/use-application-dns.net/

# Journalisation des requetes DNS volontairement DESACTIVEE par defaut :
# `log-queries` ecrit chaque domaine visite par CHAQUE compte de la machine
# (parents compris) dans un fichier sans rotation - un historique de
# navigation complet et illimite, que rien dans MintGuard ne lit. Le
# controle parental n'en a pas besoin pour fonctionner.
# Pour diagnostiquer un probleme de blocage, decommenter temporairement :
#log-queries
log-facility=/var/log/mintguard/dns.log
