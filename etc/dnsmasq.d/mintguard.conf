# Écouter sur localhost:5354 (PAS 5353 : port mDNS/Avahi standard, déjà
# utilisé par avahi-daemon sur Linux Mint, cf. SUIVI.md Phase 3)
listen-address=127.0.0.1
port=5354

# Charger blocklists dynamiques
addn-hosts=/var/lib/mintguard/blocklist.hosts

# Log queries
log-queries
log-facility=/var/log/mintguard/dns.log
